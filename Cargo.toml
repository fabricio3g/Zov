[package]
name = "enio"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Enio — Native GPU-accelerated desktop dictation and speech-to-text app"

[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
strip = "debuginfo"

[lints.rust]
dead_code = "deny"

[lints.clippy]
all = "warn"

[dependencies]
anyhow = "1"
arboard = "3"
base64 = "0.21"
bytemuck = { version = "1.25", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
cosmic-text = "0.19.0"
dirs = "5"
futures-util = "0.3"
hound = "3.5"
parking_lot = "0.12"
pollster = "0.4"
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"] }
resvg = "0.45.1"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
wgpu = "30.0.1"
winit = "0.30.13"

[target.'cfg(not(windows))'.dependencies]
cpal = "0.16"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
] }
